<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MICORPUS | Intelligence Is Evolving</title>

    <meta name="description"
          content="MICORPUS.tech — Intelligence Is Evolving. Coming Soon.">

    <meta name="theme-color" content="#000000">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .landing-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .hero-artwork {
            display: block;
            width: 100%;
            max-width: 1536px;
        }

        .hero-image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .hero-artwork {
                max-width: 640px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-image {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main class="landing-page">

        <picture class="hero-artwork">
            <source
                media="(max-width: 768px) and (orientation: portrait)"
                srcset="micorpus-mobile.png"
                width="1024"
                height="1536"
            >
            <img
                src="micorpus.png"
                alt="MICORPUS — Intelligence Is Evolving. Coming Soon."
                class="hero-image"
                width="1536"
                height="1024"
                fetchpriority="high"
            >
        </picture>

    </main>

</body>
</html>
